version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "17:00"
      timezone: Europe/Amsterdam
    assignees:
      - d-claassen

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "17:00"
      timezone: Europe/Amsterdam
    assignees:
      - d-claassen
    groups:
      wordpress:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@wordpress/*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "17:00"
      timezone: Europe/Amsterdam
    assignees:
      - d-claassen
    versioning-strategy: widen
    allow:
      - dependency-name: "*"
        dependency-type: "all"
    groups:
      unit-tests:
        patterns:
          - "phpunit/*"
          - "sebastian/*"
          - "brain/*"
          - "antecedent/*"
          - "mockery/*"
      static-analysis:
        patterns:
          - "phpstan/*"
          - "szepeviktor/phpstan-wordpress"
      code-style:
        patterns:
          - "yoast/yoastcs"
          - "phpcsstandards/*"
          - "phpcompatibility/*"
          - "wp-coding-standards/*"
          - "squizlabs/*"
          - "slevomat/*"
          - "automattic/vipwpcs"
          - "dealerdirect/phpcodesniffer-composer-installer"
      wp-compatibility:
        patterns:
          - "yoast/*"
          - "wpackagist-plugin/*"
